<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Praten">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Grote tekeningen en zinnen om samen te praten.">
  <title>Laten we praten</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="stage">
    <div id="stage-picture" class="stage__picture"></div>
  </main>

  <div class="bar">
    <button id="mic-button" class="bar__button bar__button--mic" type="button" aria-pressed="false" aria-label="Ondertiteling starten">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
        <path d="M6 11a6 6 0 0 0 12 0M12 17v4M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <p id="stage-text" class="bar__text" aria-live="polite"></p>
    <button id="speak-button" class="bar__button" type="button" aria-label="Voorlezen">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <section class="panel" aria-label="Kies een zin">
    <h2 class="panel__heading">Vragen &amp; zinnen</h2>
    <div id="phrase-tiles" class="tiles"></div>

    <h2 class="panel__heading">Antwoorden</h2>
    <div id="context-answers" class="tiles tiles--context" hidden></div>
    <div id="answer-tiles" class="tiles tiles--answers"></div>

    <div class="panel__head">
      <h2 class="panel__heading">Mensen</h2>
      <button id="people-edit" class="panel__action" type="button" aria-pressed="false" hidden>Wijzigen</button>
    </div>
    <div id="people-tiles" class="tiles tiles--people"></div>
    <p id="people-error" class="panel__error" role="alert"></p>
    <input id="people-file" type="file" accept="image/*" hidden>

    <h2 class="panel__heading">Zelf typen</h2>
    <form id="custom-form" class="custom" novalidate>
      <label for="custom-input" class="visually-hidden">Eigen woord of zin</label>
      <input id="custom-input" class="custom__input" type="text" autocomplete="off" placeholder="Typ een woord of zin…">
      <button class="custom__submit" type="submit">Toon</button>
      <p id="custom-error" class="custom__error" role="alert"></p>
    </form>
  </section>

  <dialog id="person-dialog" class="dialog" aria-labelledby="person-dialog-title">
    <form id="person-form" class="dialog__form" novalidate>
      <h2 id="person-dialog-title" class="dialog__title">Wie is dit?</h2>
      <img id="person-preview" class="dialog__preview" alt="">
      <label for="person-name" class="visually-hidden">Naam</label>
      <input id="person-name" class="custom__input" type="text" autocomplete="off" placeholder="Naam, bijvoorbeeld Oma Truus">
      <p id="person-name-error" class="custom__error" role="alert"></p>
      <div class="dialog__actions">
        <button id="person-cancel" class="dialog__cancel" type="button">Annuleren</button>
        <button class="custom__submit" type="submit">Bewaren</button>
      </div>
    </form>
  </dialog>

  <script src="js/drawings.js"></script>
  <script src="js/drawings-answers.js"></script>
  <script src="js/phrases.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/people-store.js"></script>
  <script src="js/people.js"></script>
  <script src="js/captions.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
